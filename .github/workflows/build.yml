name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install             "platforms;android-37"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;4.1.2"

      - name: Build Magisk module ZIP
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :module:zipRelease

      - name: Validate output
        shell: bash
        run: |
          ls -lah out/
          test -n "$(find out -maxdepth 1 -name '*.zip' -print -quit)"
          unzip -l "$(find out -maxdepth 1 -name '*.zip' -print -quit)"             | grep 'zygisk/x86_64.so'
          unzip -l "$(find out -maxdepth 1 -name '*.zip' -print -quit)"             | grep 'zygisk/arm64-v8a.so'

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-LD14
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0
