apply plugin: 'idea'

idea.module {
    excludeDirs += file('out')
    resourceDirs += file('template')
    resourceDirs += file('scripts')
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

ext {
    minSdk = 23
    // Android 37 is not published in the SDK manager for the Actions runner.
    // Android 36 is sufficient: Zygisk targets Android 14 (API 34) here.
    targetSdk = 36

    outDir = file("$rootDir/out")
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory, outDir
}
